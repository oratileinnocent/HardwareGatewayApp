<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#131A2B"/>
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2B45"/>
      <stop offset="100%" stop-color="#131A2B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#1F2B45" stroke-width="1.5"/>

  <!-- Title & Metadata -->
  <text x="50" y="60" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="1">PART 1: ENCLOSURE BASE (LOWER CHASSIS)</text>
  <text x="50" y="85" fill="#8F9EB8" font-family="system-ui, sans-serif" font-size="13">File: enclosure_base.stl | Outer: 38 x 76 x 11 mm | Cavity: 34 x 72 x 9 mm</text>

  <!-- 3D Isometric Projection of Base -->
  <g transform="translate(140, 110)">
    <!-- Base Outer Shell (Isometric Box) -->
    <!-- Bottom Face -->
    <path d="M 120 180 L 360 80 L 480 130 L 240 230 Z" fill="#0D1322" stroke="#1F2B45" stroke-width="2"/>
    
    <!-- Outer Walls Extrusion -->
    <!-- Left outer wall -->
    <path d="M 120 180 L 120 110 L 240 160 L 240 230 Z" fill="#151E33" stroke="#2A3B5E" stroke-width="2"/>
    <!-- Front outer wall -->
    <path d="M 240 230 L 240 160 L 480 60 L 480 130 Z" fill="#1A253E" stroke="#2A3B5E" stroke-width="2"/>

    <!-- Inner Cavity Floor (Z=2mm) -->
    <path d="M 140 160 L 350 72 L 460 118 L 250 205 Z" fill="#0B101D" stroke="#1F2B45" stroke-width="1.5"/>

    <!-- USB-C Port Cutout on Front Face -->
    <path d="M 330 122 L 390 97 L 390 120 L 330 145 Z" fill="#090D16" stroke="#00F2FE" stroke-width="2"/>
    <text x="365" y="165" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">USB-C Cutout (14x6.5mm)</text>
    <line x1="365" y1="150" x2="365" y2="135" stroke="#00F2FE" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- 4 PCB Standoffs (Internal) -->
    <!-- Standoff 1 -->
    <ellipse cx="200" cy="160" rx="9" ry="5" fill="#243456" stroke="#55D6BE" stroke-width="1.5"/>
    <ellipse cx="200" cy="160" rx="3" ry="1.5" fill="#090D16"/>
    <!-- Standoff 2 -->
    <ellipse cx="265" cy="186" rx="9" ry="5" fill="#243456" stroke="#55D6BE" stroke-width="1.5"/>
    <ellipse cx="265" cy="186" rx="3" ry="1.5" fill="#090D16"/>
    <!-- Standoff 3 -->
    <ellipse cx="320" cy="110" rx="9" ry="5" fill="#243456" stroke="#55D6BE" stroke-width="1.5"/>
    <ellipse cx="320" cy="110" rx="3" ry="1.5" fill="#090D16"/>
    <!-- Standoff 4 -->
    <ellipse cx="385" cy="136" rx="9" ry="5" fill="#243456" stroke="#55D6BE" stroke-width="1.5"/>
    <ellipse cx="385" cy="136" rx="3" ry="1.5" fill="#090D16"/>

    <!-- Standoff Annotation -->
    <line x1="160" y1="210" x2="200" y2="165" stroke="#55D6BE" stroke-width="1.5"/>
    <text x="120" y="230" fill="#55D6BE" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4x PCB Standoffs (3.5mm h)</text>
    <text x="120" y="245" fill="#8F9EB8" font-family="system-ui, sans-serif" font-size="10">M2 Pilot Screw Holes</text>

    <!-- 4 Corner Screw Bosses (M3 Heat-Set) -->
    <ellipse cx="140" cy="148" rx="8" ry="4.5" fill="#2E406A" stroke="#00F2FE" stroke-width="1.5"/>
    <ellipse cx="242" cy="190" rx="8" ry="4.5" fill="#2E406A" stroke="#00F2FE" stroke-width="1.5"/>
    <ellipse cx="355" cy="62" rx="8" ry="4.5" fill="#2E406A" stroke="#00F2FE" stroke-width="1.5"/>
    <ellipse cx="460" cy="104" rx="8" ry="4.5" fill="#2E406A" stroke="#00F2FE" stroke-width="1.5"/>

    <!-- Corner Post Annotation -->
    <line x1="480" y1="80" x2="520" y2="70" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="530" y="70" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4x M3 Corner Bosses</text>
    <text x="530" y="85" fill="#8F9EB8" font-family="system-ui, sans-serif" font-size="10">Brass Heat-Set Inserts</text>

    <!-- Passive Vent Slots Annotation -->
    <line x1="280" y1="140" x2="260" y2="80" stroke="#8F9EB8" stroke-width="1.2" stroke-dasharray="2,2"/>
    <text x="220" y="70" fill="#8F9EB8" font-family="system-ui, sans-serif" font-size="11">Bottom RF Cooling Vents</text>
  </g>

  <!-- Dimensions Indicator Bar at bottom -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="700" height="40" rx="8" fill="#131A2B" stroke="#1F2B45"/>
    <text x="20" y="25" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">
      <tspan fill="#55D6BE" font-weight="600">Features:</tspan> 2.0mm Walls • 3.5mm Standoffs • Recessed USB-C Cable Shroud • Wire Channel for 330Ω Resistors
    </text>
  </g>
</svg>
